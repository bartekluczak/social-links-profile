<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <div class="container">
      <div class="profile-info">
        <img
          class="avatar"
          src="./assets/images/avatar-bartek.jpg"
          alt="Profile picture"
        />
        <div>
          <h1 class="name">Bartek Łuczak</h1>
          <p class="location">Poznań, Poland</p>
        </div>
        <div class="description">"Front-end developer and QA Engineer."</div>
      </div>
      <div class="links">
        <a
          class="social-button"
          href="https://github.com/bartekluczak"
          target="_blank"
          >GitHub</a
        >
        <a
          class="social-button"
          href="https://www.frontendmentor.io/profile/bartekluczak"
          target="_blank"
          >Frontend Mentor</a
        >
        <a
          class="social-button"
          href="https://www.linkedin.com/in/bartosz-%C5%82uczak/"
          target="_blank"
          >LinkedIn</a
        >
        <a class="social-button" href="https://x.com" target="_blank">X.com</a>
        <a
          class="social-button"
          href="https://www.instagram.com/_skowyrny/"
          target="_blank"
          >Instagram</a
        >
      </div>
    </div>
  </body>
</html>
